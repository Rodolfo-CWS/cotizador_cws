<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma Sifra{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #f5f4f1; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1080px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card h1 { font-size: 20px; color: #1e293b; margin: 0 0 4px 0; }
        .card .subtitle { color: #78716c; font-size: 14px; margin: 0 0 24px 0; }
        .nav { display: flex; gap: 4px; margin-bottom: 20px; background: white; border-radius: 12px; padding: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .nav a { padding: 10px 16px; border-radius: 8px; font-size: 14px; color: #44403c; text-decoration: none; }
        .nav a.active { background: #4f46e5; color: white; }
        .nav a:hover:not(.active) { background: #f5f4f1; }
        .flash { padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
        .flash-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .stat { background: #faf9f7; border: 1px solid #e7e5e4; border-radius: 10px; padding: 14px; }
        .stat .label { font-size: 12px; color: #78716c; margin-bottom: 4px; }
        .stat .value { font-size: 18px; font-weight: 600; color: #1e293b; }
        .ok { color: #16a34a; } .warn { color: #d97706; } .err { color: #dc2626; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e7e5e4; }
        th { color: #78716c; font-weight: 500; font-size: 12px; text-transform: uppercase; }
        tr:hover td { background: #faf9f7; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
        .badge-active { background: #f0fdf4; color: #16a34a; }
        .badge-inactive { background: #fef2f2; color: #dc2626; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #4f46e5; color: white; } .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #e7e5e4; color: #44403c; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .form-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        select, input { padding: 8px 12px; border: 1.5px solid #d6d3d1; border-radius: 8px; font-size: 14px; color: #1e293b; background: #faf9f7; }
        .muted { color: #78716c; font-size: 13px; }
        .kv { display: grid; grid-template-columns: 200px 1fr; gap: 8px 12px; font-size: 14px; }
        .kv .k { color: #78716c; }
        .section-title { font-size: 15px; font-weight: 600; color: #1e293b; margin: 20px 0 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/admin/" class="{{ 'active' if request.path.rstrip('/') == '/admin' else '' }}">Dashboard</a>
            <a href="/admin/companies" class="{{ 'active' if request.path.startswith('/admin/companies') else '' }}">Empresas</a>
            <a href="/admin/pricing" class="{{ 'active' if request.path.startswith('/admin/pricing') else '' }}">Tarifas</a>
            <a href="/">Volver</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
