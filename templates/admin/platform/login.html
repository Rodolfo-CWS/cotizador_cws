<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Plataforma Sifra</title>
    <style>
        body { background: #f5f4f1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: white; border-radius: 14px; padding: 40px 32px; width: 100%; max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); text-align: center; }
        .login-card .mark { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4f46e5; font-weight: 600; margin-bottom: 8px; }
        .login-card h1 { font-size: 20px; color: #1e293b; margin: 0 0 4px 0; }
        .login-card p { color: #78716c; font-size: 14px; margin: 0 0 24px 0; }
        .login-card input { width: 100%; padding: 12px 14px; border: 1.5px solid #d6d3d1; border-radius: 8px; font-size: 15px; color: #1e293b; background: #faf9f7; box-sizing: border-box; margin-bottom: 12px; }
        .login-card input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); background: white; }
        .login-card button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #4f46e5; color: white; font-size: 15px; font-weight: 500; cursor: pointer; }
        .login-card button:hover { background: #4338ca; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="mark">Sifra</div>
        <h1>Plataforma</h1>
        <p>Acceso restringido al administrador</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin/login">
            <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password">
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
